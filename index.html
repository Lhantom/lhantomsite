<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phren Lhantom — Paintings</title>
  <meta name="description" content="Paintings by Phren Lhantom. View the work, request a commission, or get in touch.">
  <meta name="theme-color" content="#030303">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2026-10-25h">
  <script>document.documentElement.classList.add('js');</script>
  <script src="script.js?v=2026-10-25h" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="site">
    <!-- Atmosphere: drifting fog and cursor halo (decorative) -->
    <div class="fog" aria-hidden="true">
      <div class="fog__blob fog__blob--a"></div>
      <div class="fog__blob fog__blob--b"></div>
      <div class="fog__vignette"></div>
    </div>
    <div class="halo" aria-hidden="true"></div>

    <div class="content">
      <nav class="nav" aria-label="Main">
        <div class="nav__links">
          <a href="index.html" aria-current="page">Home</a>
          <a href="gallery.html">Gallery</a>
          <a href="contact.html">Contact</a>
          <a class="nav__icon" href="https://www.instagram.com/lhantom_art/" target="_blank" rel="noopener" aria-label="Instagram (opens in a new tab)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false">
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle cx="17.3" cy="6.7" r="0.6" fill="currentColor"></circle>
            </svg>
          </a>
        </div>
      </nav>

      <header class="hero reveal reveal--hero">
        <h1 class="hero__name">Phren Lhantom</h1>
      </header>

      <main id="main">
        <section id="about" class="about reveal" aria-labelledby="about-title">
          <h2 id="about-title" class="script-title">About</h2>
          <p>I hope you like my oil paintings of faces and figures,<br>
            kissed by moonlight and shadow. Each piece is a secret I couldn’t keep,<br>
            waiting to be seen, held, or<br>
            to be you…</p>
        </section>

        <section class="gallery gallery--featured" aria-labelledby="featured-title">
          <h2 id="featured-title" class="visually-hidden">Featured painting</h2>
          <!-- The painting marked `featured` in script.js -->
          <div class="gallery__grid gallery__grid--featured" data-gallery="featured"></div>
          <noscript><p class="gallery__noscript">Turn on JavaScript to view the paintings.</p></noscript>
          <p class="cta reveal"><a class="cta__link" href="gallery.html">View the Gallery</a></p>
        </section>
      </main>

      <footer class="footer">
        <span>© 2026 Phren Lhantom</span>
        <a href="contact.html">Contact</a>
        <a class="footer__icon" href="https://www.instagram.com/lhantom_art/" target="_blank" rel="noopener" aria-label="Instagram (opens in a new tab)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.3" cy="6.7" r="0.6" fill="currentColor"></circle>
          </svg>
        </a>
      </footer>
    </div>
  </div>

  <!-- Enlarged painting, filled in by script.js -->
  <dialog class="lightbox" aria-labelledby="lightbox-title">
    <button class="lightbox__close" type="button" aria-label="Close">×</button>
    <figure class="lightbox__figure">
      <div class="lightbox__art"></div>
      <figcaption class="lightbox__caption">
        <span id="lightbox-title" class="lightbox__title"></span>
        <span class="lightbox__meta"></span>
        <span class="lightbox__availability"></span>
      </figcaption>
    </figure>
  </dialog>
</body>
</html>
